<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket Chat — Real-time Messenger</title>
    <meta name="description" content="Real-time chat application powered by WebSockets">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }        :root {
            --bg-page: #F8FAFC;
            --bg-card: rgba(255, 255, 255, 0.75);
            --bg-card-solid: #FFFFFF;
            --accent: #3B82F6;
            --accent-light: #60a5fa;
            --accent-ultra-light: rgba(59, 130, 246, 0.1);
            --accent-glow: rgba(59, 130, 246, 0.15);
            --teal: #2563eb;
            --teal-light: #60a5fa;
            --coral: #db2777;
            --sky: #3B82F6;
            --mint: #10b981;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --border: rgba(15, 23, 42, 0.08);
            --border-light: rgba(15, 23, 42, 0.05);
            --msg-own: linear-gradient(135deg, #3B82F6, #60a5fa);
            --msg-other-bg: #E2E8F0;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 8px 32px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 20px 60px rgba(15, 23, 42, 0.08);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            /* Theme Orbs and Radial Background variables */
            --orb-1: linear-gradient(135deg, #3B82F6, #60a5fa);
            --orb-2: linear-gradient(135deg, rgba(59, 130, 246, 0.3), #1e3a8a);
            --orb-opacity: 0.15;
            --bg-radial: radial-gradient(ellipse at 0% 0%, rgba(59, 130, 246, 0.08) 0%, transparent 60%), radial-gradient(ellipse at 100% 0%, rgba(59, 130, 246, 0.05) 0%, transparent 60%), radial-gradient(ellipse at 50% 100%, rgba(59, 130, 246, 0.03) 0%, transparent 60%), #F8FAFC;
        }

        html, body {
            height: 100%;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-radial);
        }

        /* Floating orbs background styling using Vivid Sky Blue #3B82F6 */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: var(--orb-opacity);
            z-index: 0;
            animation: floatOrb 15s ease-in-out infinite alternate;
        }
        body::before {
            width: 450px; height: 450px;
            background: var(--orb-1);
            top: -150px; left: -150px;
        }
        body::after {
            width: 400px; height: 400px;
            background: var(--orb-2);
            bottom: -100px; right: -100px;
            animation-delay: -7.5s;
        }

        @keyframes floatOrb {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        /* ── App Shell ── */
        #app {
            position: relative; z-index: 1;
            width: 100%; max-width: 480px;
            height: 96vh; max-height: 780px;
            display: flex; flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 28px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.05) inset;
            overflow: hidden;
            animation: cardIn 0.7s ease-out;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Chat Screen ── */
        #chat-screen {
            flex: 1; display: flex; flex-direction: column;
            min-height: 0; overflow: hidden;
            position: relative;
        }

        /* ── Header ── */
        .chat-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 22px;
            background: rgba(255, 255, 255, 0.75);
            border-bottom: 1px solid rgba(15, 23, 42, 0.05);
            backdrop-filter: blur(12px);
        }

        .chat-header-left {
            display: flex; align-items: center; gap: 14px;
        }

        .chat-header-icon {
            width: 44px; height: 44px; border-radius: 14px;
            background: var(--msg-own);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
            transition: var(--transition);
        }
        .chat-header-icon:hover { transform: rotate(-8deg) scale(1.05); }

        .chat-header-info h1 {
            font-size: 17px; font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chat-header-info span {
            font-size: 12px; font-weight: 500;
            color: var(--text-muted);
            display: flex; align-items: center; gap: 5px;
        }

        .online-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--mint);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.5; transform: scale(0.8); }
        }

        /* ── Messages ── */
        #messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 6px;
            scroll-behavior: smooth;
        }

        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb {
            background: var(--border); border-radius: 10px;
        }

        .message {
            max-width: 78%; padding: 12px 16px;
            border-radius: 20px; font-size: 14px;
            line-height: 1.55; word-wrap: break-word;
            animation: msgPop 0.35s ease-out;
            transition: transform 0.15s ease;
        }
        .message:hover { transform: scale(1.01); }

        @keyframes msgPop {
            from { opacity: 0; transform: translateY(10px) scale(0.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.own {
            align-self: flex-end;
            background: var(--msg-own);
            color: #fff;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.2);
        }

        .message.other {
            align-self: flex-start;
            background: var(--msg-other-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            border-bottom-left-radius: 6px;
            box-shadow: var(--shadow-sm);
        }

        .message .sender {
            font-size: 11px; font-weight: 700;
            color: var(--accent-light);
            margin-bottom: 3px; display: block;
            letter-spacing: 0.3px;
        }
        .message.own .sender { display: none; }

        .message .timestamp {
            font-size: 10px; margin-top: 5px;
            text-align: right; display: block; font-weight: 500;
        }
        .message.own .timestamp { color: rgba(255,255,255,0.6); }
        .message.other .timestamp { color: var(--text-muted); }

        .system-msg {
            text-align: center; font-size: 12px; font-weight: 600;
            color: var(--text-muted); padding: 8px 0;
            animation: msgPop 0.35s ease-out;
        }
        .system-msg strong { color: var(--accent-light); }

        /* ── Typing Indicator ── */
        .typing-indicator {
            display: none; align-items: center; gap: 8px;
            padding: 6px 22px; font-size: 12px; font-weight: 500;
            color: var(--text-muted);
            animation: fadeSlideIn 0.25s ease-out;
        }
        .typing-indicator.visible { display: flex; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .typing-dots { display: flex; align-items: center; gap: 3px; }
        .typing-dots span {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--accent-light);
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
            30%           { transform: translateY(-5px); opacity: 1; }
        }

        .typing-name { font-weight: 700; color: var(--accent-light); }

        /* ── Input Area ── */
        .chat-input-area {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.75);
            border-top: 1px solid rgba(15, 23, 42, 0.05);
            backdrop-filter: blur(12px);
        }

        #message-input {
            flex: 1; padding: 13px 20px;
            border: 1px solid var(--border-light);
            border-radius: 50px;
            background: var(--msg-other-bg);
            color: var(--text-primary);
            font-size: 14px; font-family: inherit; font-weight: 500;
            outline: none; transition: var(--transition);
        }
        #message-input:focus {
            border-color: var(--accent-light);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        #message-input::placeholder { color: var(--text-muted); font-weight: 400; }

        #send-btn {
            width: 46px; height: 46px; border: none; border-radius: 50%;
            background: var(--msg-own);
            color: #fff; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition); flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }
        #send-btn:hover {
            transform: scale(1.1) rotate(-4deg);
            box-shadow: 0 6px 24px rgba(59, 130, 246, 0.4);
        }
        #send-btn:active { transform: scale(0.92); }

        /* ── Icon Buttons (emoji / attach) ── */
        .icon-btn {
            width: 38px; height: 38px; border: none; border-radius: 50%;
            background: rgba(15, 23, 42, 0.05);
            color: var(--text-muted); font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition); flex-shrink: 0;
        }
        .icon-btn:hover {
            background: rgba(15, 23, 42, 0.1);
            color: var(--text-primary);
            transform: scale(1.1);
        }
        .icon-btn:active { transform: scale(0.92); }

        /* ── Emoji Picker ── */
        #emoji-picker {
            position: absolute; bottom: 76px; left: 14px;
            width: 300px;
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow-lg);
            padding: 12px;
            display: none; flex-direction: column; gap: 8px;
            z-index: 50;
            animation: fadeSlideIn 0.2s ease-out;
        }
        #emoji-picker.open { display: flex; }
        .emoji-categories {
            display: flex; gap: 6px; overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }
        .emoji-categories::-webkit-scrollbar { display: none; }
        .emoji-cat-btn {
            border: none; background: transparent;
            font-size: 18px; cursor: pointer; padding: 4px 6px;
            border-radius: 8px; flex-shrink: 0;
            transition: background 0.15s;
        }
        .emoji-cat-btn:hover, .emoji-cat-btn.active {
            background: rgba(15, 23, 42, 0.06);
        }
        .emoji-grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 4px; max-height: 180px; overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,0,0,0.1) transparent;
        }
        .emoji-item {
            border: none; background: transparent;
            font-size: 20px; cursor: pointer;
            padding: 4px; border-radius: 8px;
            transition: background 0.15s; line-height: 1;
        }
        .emoji-item:hover { background: rgba(15, 23, 42, 0.06); }

        /* ── Image message ── */
        .msg-image {
            max-width: 220px; max-height: 220px;
            border-radius: 12px; display: block;
            margin-top: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .msg-image:hover { opacity: 0.88; }

        /* ── File attachment message ── */
        .msg-file {
            display: flex; align-items: center; gap: 10px;
            background: rgba(15, 23, 42, 0.04);
            border: 1px solid var(--border-light);
            border-radius: 12px; padding: 10px 14px;
            margin-top: 4px; cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }
        .msg-file:hover { background: rgba(15, 23, 42, 0.08); }
        .msg-file-icon { font-size: 24px; flex-shrink: 0; }
        .msg-file-info { display: flex; flex-direction: column; min-width: 0; }
        .msg-file-name {
            font-size: 13px; font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 140px;
        }
        .msg-file-size { font-size: 11px; color: var(--text-muted); }
        .message.own .msg-file { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.2); }
        .message.own .msg-file:hover { background: rgba(255, 255, 255, 0.25); }
        .message.own .msg-file-name { color: #fff; }
        .message.own .msg-file-size { color: rgba(255, 255, 255, 0.7); }

        /* ── Lightbox ── */
        #lightbox {
            display: none; position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
            align-items: center; justify-content: center;
        }
        #lightbox.open { display: flex; }
        #lightbox img {
            max-width: 90vw; max-height: 88vh;
            border-radius: 16px;
            box-shadow: 0 8px 60px rgba(0, 0, 0, 0.7);
            animation: msgPop 0.3s ease-out;
        }
        #lightbox-close {
            position: absolute; top: 20px; right: 24px;
            color: #000; font-size: 32px; cursor: pointer;
            line-height: 1; background: rgba(255, 255, 255, 0.5);
            border: none; border-radius: 50%;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        #lightbox-close:hover { background: rgba(255, 255, 255, 0.8); }


        /* ── Responsive ── */
        @media (max-width: 560px) {
            #app {
                max-width: 100%; height: 100vh;
                max-height: 100vh; border-radius: 0;
            }
        }

        /* ── Name Entry Overlay ── */
        #name-overlay {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-radial);
            animation: cardIn 0.5s ease-out;
        }
        #name-overlay.hidden { display: none; }

        .name-card {
            width: 100%; max-width: 400px; margin: 16px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 32px; padding: 44px 36px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.05) inset;
            display: flex; flex-direction: column;
            align-items: center; gap: 20px;
        }

        .name-card-icon {
            width: 72px; height: 72px; border-radius: 22px;
            background: var(--msg-own);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        .name-card h2 {
            font-size: 24px; font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center; letter-spacing: -0.5px;
        }

        .name-card p {
            font-size: 14px; color: var(--text-muted);
            text-align: center; margin-top: -8px;
            line-height: 1.6; font-weight: 500;
        }

        .name-input-wrap {
            width: 100%; display: flex;
            flex-direction: column; gap: 14px;
        }

        #username-input {
            width: 100%; padding: 15px 20px;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            background: var(--msg-other-bg);
            color: var(--text-primary);
            font-size: 15px; font-family: inherit; font-weight: 500;
            outline: none; transition: var(--transition);
            text-align: center; letter-spacing: 0.3px;
        }
        #username-input:focus {
            border-color: var(--accent-light);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        #username-input::placeholder { color: var(--text-muted); font-weight: 400; }

        #join-btn {
            width: 100%; padding: 15px;
            border: none; border-radius: 16px;
            background: var(--msg-own);
            color: #fff; font-size: 15px;
            font-weight: 700; font-family: inherit;
            cursor: pointer; transition: var(--transition);
            letter-spacing: 0.3px;
            box-shadow: 0 6px 24px rgba(59, 130, 246, 0.3);
        }
        #join-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(59, 130, 246, 0.4);
        }
        #join-btn:active { transform: translateY(0); }

        #name-error {
            font-size: 12px; color: #f87171;
            text-align: center; min-height: 16px; font-weight: 600;
        }
    </style>
</head>
<body>

<!-- Name Entry Overlay -->
<div id="name-overlay">
    <div class="name-card">
        <div class="name-card-icon">💬</div>
        <h2>Welcome to Socket Chat</h2>
        <p>Enter your name to join the conversation</p>
        <div class="name-input-wrap">
            <input
                type="text"
                id="username-input"
                placeholder="Your name…"
                maxlength="24"
                autocomplete="off"
            >
            <div id="name-error"></div>
            <button id="join-btn">Join Chat →</button>
        </div>
    </div>
</div>

<div id="app">

    <!-- Chat Screen -->
    <div id="chat-screen">
        <header class="chat-header">
            <div class="chat-header-left">
                <div class="chat-header-icon">💬</div>
                <div class="chat-header-info">
                    <h1>Socket Chat</h1>
                    <span><span class="online-dot"></span> Online</span>
                </div>
            </div>
        </header>

        <div id="messages"></div>

        <div class="typing-indicator" id="typing-indicator">
            <div class="typing-dots"><span></span><span></span><span></span></div>
            <span><span class="typing-name" id="typing-name">Someone</span> is typing…</span>
        </div>

        <!-- Emoji Picker Panel -->
        <div id="emoji-picker">
            <div class="emoji-categories" id="emoji-cats"></div>
            <div class="emoji-grid" id="emoji-grid"></div>
        </div>

        <form class="chat-input-area" id="message-form">
            <!-- Emoji button -->
            <button type="button" class="icon-btn" id="emoji-btn" aria-label="Emoji">
                😊
            </button>
            <!-- Attach file/photo -->
            <button type="button" class="icon-btn" id="attach-btn" aria-label="Attach file or photo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                </svg>
            </button>
            <!-- Hidden file input -->
            <input type="file" id="file-input" accept="image/*,video/*,.pdf,.doc,.docx,.txt,.zip,.xls,.xlsx,.ppt,.pptx" style="display:none">
            <input type="text" id="message-input" placeholder="Type a message…" autocomplete="off">
            <button type="submit" id="send-btn" aria-label="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </form>
    </div>
</div>

<!-- Lightbox -->
<div id="lightbox">
    <button id="lightbox-close" aria-label="Close">✕</button>
    <img id="lightbox-img" src="" alt="Full size image">
</div>

<!-- Socket.IO Client -->
<script src="/socket.io/socket.io.js"></script>
<script>
    // ── DOM refs ──
    const socket = io();
    let myUsername = '';

    // ── Name Entry ──
    const nameOverlay   = document.getElementById('name-overlay');
    const usernameInput = document.getElementById('username-input');
    const joinBtn       = document.getElementById('join-btn');
    const nameError     = document.getElementById('name-error');

    function joinChat() {
        const name = usernameInput.value.trim();
        if (!name) {
            nameError.textContent = 'Please enter a name to continue.';
            usernameInput.focus();
            return;
        }
        myUsername = name;
        nameOverlay.classList.add('hidden');
        messageInput.focus();
        appendMessage({ text: `You joined as <strong>${myUsername}</strong> 👋`, sender: '', isSystem: true });
    }

    joinBtn.addEventListener('click', joinChat);
    usernameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') joinChat();
        nameError.textContent = '';
    });


    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const messagesDiv  = document.getElementById('messages');

    // ── Helpers ──
    function getTime() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function appendMessage({ text, sender, isOwn = false, isSystem = false, html = null }) {
        if (isSystem) {
            const div = document.createElement('div');
            div.className = 'system-msg';
            div.innerHTML = text;
            messagesDiv.appendChild(div);
        } else {
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'own' : 'other'}`;
            const body = html !== null ? html : escapeHtml(text);
            div.innerHTML = `
                <span class="sender">${sender}</span>
                ${body}
                <div class="timestamp">${getTime()}</div>
            `;
            messagesDiv.appendChild(div);
        }
        scrollToBottom();
    }

    function escapeHtml(str) {
        return str
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatBytes(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
        return (bytes/1048576).toFixed(1) + ' MB';
    }

    function fileIcon(mime) {
        if (mime.startsWith('image/')) return '🖼️';
        if (mime.startsWith('video/')) return '🎬';
        if (mime.includes('pdf'))     return '📄';
        if (mime.includes('zip') || mime.includes('rar')) return '🗜️';
        if (mime.includes('sheet') || mime.includes('excel')) return '📊';
        if (mime.includes('presentation') || mime.includes('powerpoint')) return '📊';
        return '📎';
    }



    // ── Welcome message ──
    appendMessage({ text: 'Welcome to the chat 👋', sender: 'Socket Chat', isOwn: false });

    // ── Send text message ──
    messageForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = messageInput.value.trim();
        if (!text) return;
        appendMessage({ text, sender: 'You', isOwn: true });
        socket.emit('user-message', { message: text, sender: myUsername });
        messageInput.value = '';
        messageInput.focus();
    });

    // ── Typing indicator with debounce ──
    let typingTimeout = null;
    messageInput.addEventListener('input', () => {
        if (!typingTimeout) socket.emit('user:typing', { sender: myUsername });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => { typingTimeout = null; }, 500);
    });

    // ── Typing indicator from other users ──
    const typingIndicator = document.getElementById('typing-indicator');
    const typingNameEl    = document.getElementById('typing-name');
    let typingHideTimeout = null;
    socket.on('server:user-typing', (data) => {
        const name = data?.sender || data?.username || 'Someone';
        typingNameEl.textContent = name;
        typingIndicator.classList.add('visible');
        clearTimeout(typingHideTimeout);
        typingHideTimeout = setTimeout(() => typingIndicator.classList.remove('visible'), 1000);
    });

    // ── Receive rich messages from server ──
    socket.on('server:message', (data) => {
        if (data.fileData) {
            // image or file from another user
            let html;
            if (data.fileType && data.fileType.startsWith('image/')) {
                html = `<img class="msg-image" src="${data.fileData}" alt="${escapeHtml(data.fileName||'image')}" onclick="openLightbox(this.src)">`;
            } else {
                html = `<a class="msg-file" href="${data.fileData}" download="${escapeHtml(data.fileName||'file')}">
                    <span class="msg-file-icon">${fileIcon(data.fileType||'')}</span>
                    <span class="msg-file-info">
                        <span class="msg-file-name">${escapeHtml(data.fileName||'file')}</span>
                        <span class="msg-file-size">${formatBytes(data.fileSize||0)}</span>
                    </span></a>`;
            }
            appendMessage({ html, sender: data.sender || 'Anon', isOwn: false });
        } else {
            appendMessage({ text: data.message || data.text || '', sender: data.sender || 'Anon', isOwn: false });
        }
    });

    // ── File / Photo upload ──
    const fileInput  = document.getElementById('file-input');
    const attachBtn  = document.getElementById('attach-btn');
    attachBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;
        const MAX = 5 * 1024 * 1024; // 5 MB
        if (file.size > MAX) {
            alert('File too large (max 5 MB)');
            fileInput.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
            const dataUrl = ev.target.result;
            // Show locally
            let html;
            if (file.type.startsWith('image/')) {
                html = `<img class="msg-image" src="${dataUrl}" alt="${escapeHtml(file.name)}" onclick="openLightbox(this.src)">`;
            } else {
                html = `<a class="msg-file" href="${dataUrl}" download="${escapeHtml(file.name)}">
                    <span class="msg-file-icon">${fileIcon(file.type)}</span>
                    <span class="msg-file-info">
                        <span class="msg-file-name">${escapeHtml(file.name)}</span>
                        <span class="msg-file-size">${formatBytes(file.size)}</span>
                    </span></a>`;
            }
            appendMessage({ html, sender: 'You', isOwn: true });
            socket.emit('user-message', {
                sender: myUsername,
                fileData: dataUrl,
                fileName: file.name,
                fileType: file.type,
                fileSize: file.size
            });
        };
        reader.readAsDataURL(file);
        fileInput.value = '';
    });

    // ── Lightbox ──
    const lightbox     = document.getElementById('lightbox');
    const lightboxImg  = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    window.openLightbox = (src) => { lightboxImg.src = src; lightbox.classList.add('open'); };
    lightboxClose.addEventListener('click', () => lightbox.classList.remove('open'));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });

    // ── Emoji Picker ──
    const emojiData = {
        '😊': ['😀','😃','😄','😁','😅','😂','🤣','😊','😇','🙂','😉','😍','🥰','😘','😎','🤩','😜','😝','🤪','😏','😒','😞','😔','😟','😢','😭','🥺','😤','😡','🤬','😱','😨','😰','😓','🤗','😷','🤒','🤕','😴','🥱'],
        '👍': ['👍','👎','👋','🤚','✋','🖐️','👌','🤌','🤏','✌️','🤞','🤙','👈','👉','👆','👇','☝️','👏','🙌','🤲','🙏','💪','🦾','🤜','🤛','✊','👊'],
        '❤️': ['❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','💟','☮️','✝️','☯️','🔥','✨','⭐','🌟','💫','⚡','🎉','🎊','🎈','🎁','🏆','🥇','🎯','🎵','🎶'],
        '🐶': ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🙈','🦄','🐔','🐧','🐦','🦆','🦅','🦉','🦇','🐺','🐗','🐴','🦋','🐛','🦗','🐜'],
        '🍕': ['🍕','🍔','🌮','🌯','🍜','🍣','🍱','🍛','🍲','🥗','🥘','🥙','🧆','🥚','🍳','🥞','🧇','🧀','🥩','🍗','🍖','🌭','🥪','🥫','🍰','🎂','🧁','🍮','🍬','🍭','🍡','🧃','🥤','☕','🍵','🍺','🥂'],
        '⚽': ['⚽','🏀','🏈','⚾','🎾','🏐','🏉','🎱','🏓','🏸','🥊','🥋','🎿','⛷️','🏂','🏊','🤽','🚣','🧗','🚵','🚴','🏋️','🤼','🤸','🤺','🥅','⛳','🎯','🎳','🎮','🕹️'],
        '🌍': ['🌍','🌎','🌏','🌐','🗺️','🏔️','⛰️','🌋','🏕️','🏖️','🏜️','🏝️','🏠','🏡','🏢','🏣','🏤','🏥','🏦','🏨','🚗','🚕','🚙','🚌','✈️','🚀','🛸','⛵','🚢','🚂','🚃']
    };
    const catIcons = Object.keys(emojiData);
    const emojiPicker = document.getElementById('emoji-picker');
    const emojiGrid   = document.getElementById('emoji-grid');
    const emojiCats   = document.getElementById('emoji-cats');
    const emojiBtn    = document.getElementById('emoji-btn');
    let activeCat = catIcons[0];

    function renderEmojiGrid(cat) {
        activeCat = cat;
        emojiGrid.innerHTML = '';
        emojiData[cat].forEach(em => {
            const btn = document.createElement('button');
            btn.type = 'button'; btn.className = 'emoji-item';
            btn.textContent = em;
            btn.addEventListener('click', () => {
                messageInput.value += em;
                messageInput.focus();
            });
            emojiGrid.appendChild(btn);
        });
        document.querySelectorAll('.emoji-cat-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.cat === cat);
        });
    }

    catIcons.forEach(icon => {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'emoji-cat-btn';
        btn.textContent = icon; btn.dataset.cat = icon;
        btn.addEventListener('click', () => renderEmojiGrid(icon));
        emojiCats.appendChild(btn);
    });
    renderEmojiGrid(catIcons[0]);

    emojiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        emojiPicker.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
        if (!emojiPicker.contains(e.target) && e.target !== emojiBtn)
            emojiPicker.classList.remove('open');
    });
</script>

</body>
</html>
